version: '3.8'

services:
  og-ai:
    build: .
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    volumes:
      # Mount config for easy updates without rebuilding
      - ./config.json:/app/config.json:ro
      # Mount conversations directory to persist data
      - ./conversations:/app/conversations
    restart: unless-stopped
    healthcheck:
      # curl is not present in the python:3.12-slim image; use Python instead
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
