services:
  - type: web
    name: og-ai-service
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn app:app -w 2 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: production
      - key: DEVELOPMENT_MODE
        value: false
      # OG Pro entitlement v2 (Stripe webhook) — ships OFF; see the Round-2
      # section of og-what-people-want-fixes.md for the one-time setup.
      - key: OG_WEBHOOK_ENABLED
        value: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Durable memory — free Postgres connection string (Neon/Supabase).
      - key: OG_MEMORY_DB_URL
        sync: false
    healthCheckPath: /health
